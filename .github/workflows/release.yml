name: release

# Push a tag like v0.2.0 on a commit that is on main to publish a GitHub Release.
# The wheel and sdist are built once, installed and run, checksummed and (where available)
# given signed build provenance; the release holds exactly those files.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: false # a release must not restore a cache a PR could have written
      - name: Fail unless the tagged commit is on main and the tag matches the version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(uvx --from toml-cli==0.7.0 toml get --toml-path pyproject.toml project.version)
          test "$GITHUB_REF_NAME" = "v${version}"
      - run: uv build
      - name: Install the wheel in a clean venv and run the CLI
        working-directory: ${{ runner.temp }}
        env:
          RUN_DB: ${{ runner.temp }}/runs.db
        run: |
          uv venv smoke
          uv pip install --python smoke/bin/python "$GITHUB_WORKSPACE"/dist/*.whl
          smoke/bin/agent-template --help
          smoke/bin/agent-template history
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS
      # Private repos need GitHub Enterprise Cloud for artifact attestations. Set the repository
      # variable ATTESTATIONS_ENABLED=true where it is available (or the repo is public).
      - name: Sign build provenance for the wheel and sdist
        if: vars.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers to the release environment to approve each release.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Publish the GitHub Release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
