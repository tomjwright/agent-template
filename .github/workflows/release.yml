name: release

# Push a tag like v0.2.0 on a commit that is on main to publish a GitHub Release.
# The wheel and sdist are built once, installed and run, checksummed and (where available)
# given signed build provenance; the release holds exactly those files.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false # a release must not restore a cache a PR could have written
      - name: Fail unless the tagged commit is on main and the tag matches the version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(uvx --from toml-cli==0.7.0 toml get --toml-path pyproject.toml project.version)
          test "$GITHUB_REF_NAME" = "v${version}"
      - run: uv build
      - name: Install the wheel in a clean venv and run the CLI
        working-directory: ${{ runner.temp }}
        env:
          RUN_DB: ${{ runner.temp }}/runs.db
        run: |
          uv venv smoke
          uv pip install --python smoke/bin/python "$GITHUB_WORKSPACE"/dist/*.whl
          smoke/bin/agent-template --help
          smoke/bin/agent-template history
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS
      # Private repos need GitHub Enterprise Cloud for artifact attestations. Set the repository
      # variable ATTESTATIONS_ENABLED=true where it is available (or the repo is public).
      - name: Sign build provenance for the wheel and sdist
        if: vars.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers to the release environment to approve each release.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish the GitHub Release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag could have been moved to another commit while the release waited for approval.
        run: |
          tagged=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)
          test "$tagged" = "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
