name: Evals

# The release gate: runs the example app on evals/cases.yaml with the real
# model, and fails when the score drops. Make "evals" a required check so a
# failing change can't merge.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: the skip check diffs against origin/<base>
          persist-credentials: false
      - name: Skip when only text files changed
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git -c core.quotePath=false diff --name-only --no-renames "origin/${BASE_REF}...HEAD")
          if ! echo "$changed" | grep -qvE '\.(md|txt|rst)$'; then
            echo "Only text files changed, so no LLM calls are needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.changes.outputs.skip != 'true'
      - run: uv sync --frozen
        if: steps.changes.outputs.skip != 'true'
      - name: Run the evals
        if: steps.changes.outputs.skip != 'true'
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::Add GOOGLE_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi
          uv run python -m agent_template.evals --app examples.job_finder.app
        env:
          # Gemini for CI runs; the app's default is Anthropic (LLM_MODEL).
          LLM_MODEL: google_genai:gemini-3.5-flash
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
