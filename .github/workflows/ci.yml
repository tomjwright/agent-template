name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Test, failing below the coverage floor in pyproject.toml
        run: uv run pytest --cov
      - name: Audit dependencies for known vulnerabilities
        run: uv export --frozen --no-hashes --no-emit-project | uv run pip-audit --strict -r /dev/stdin
      - name: Fail on any licence outside this permissive list (GPL and AGPL are not on it)
        run: uv run pip-licenses --from=mixed --partial-match --allow-only "MIT;BSD;Apache;ISC;PSF;Python Software Foundation;MPL-2.0;Mozilla Public License 2.0;LGPL;GNU Lesser General Public License;Unlicense"

  # The code must run on any machine: these catch paths and file handling that only work on Linux.
  test-other-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run pytest

  # Mutation testing: mutmut changes the routing and pricing code one small edit at a time and
  # the tests must notice. The floor is in scripts/mutation_floor.py's call below.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - name: Mutate orchestrator.py and pricing.py and run the tests on each mutant
        run: uv run mutmut run --max-children 4
      - name: Fail below 85% killed in any mutated file
        run: uv run mutmut results --all true | python3 scripts/mutation_floor.py 85

  # Semgrep CE: free static analysis for Python and the workflows, results stay in the log
  # (no account, no upload), so it runs on private repos without GitHub Code Security.
  # Python 3.12 because semgrep's dependencies do not resolve on 3.14 yet.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Fail on any Semgrep finding in src, examples or the workflows
        run: >-
          uvx --python 3.12 semgrep@1.187.0 scan --metrics=off --error
          --config p/python --config p/github-actions src examples .github

  # The wheel is what users install: build it, install it into a clean venv with none of the
  # dev tools, and run the CLI. Catches missing package files and imports of dev-only packages.
  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build --wheel
      - run: uv venv "$RUNNER_TEMP/smoke"
      - run: uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
      - name: Run the installed CLI outside the repo
        working-directory: ${{ runner.temp }}
        env:
          RUN_DB: ${{ runner.temp }}/runs.db
        run: |
          "$RUNNER_TEMP/smoke/bin/agent-template" --help
          "$RUNNER_TEMP/smoke/bin/agent-template" history

  # The gitleaks CLI is free on every repo; gitleaks-action needs a paid licence key for
  # organization accounts. Scans the full history, so a secret in any commit fails.
  secrets-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks
      - run: ./gitleaks git --redact --no-banner .
      # git log shows no diff for a merge commit, so also scan the files as they are now.
      - run: ./gitleaks dir --redact --no-banner .
