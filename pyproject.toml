[project]
name = "agent-template"
version = "0.1.0"
description = "A template for building multi-agent applications on LangGraph: agents as subgraphs, a supervisor router, shared state, evals and tracing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.6,<2",
    "langchain-anthropic>=1.0,<2",
    "langgraph>=1.2.16,<2",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
agent-template = "agent_template.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_template"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
